# Netlify: build the static site, serve every unknown path as the app (SPA fallback), and send the same
# security headers as deploy/headers.conf (the source of truth, verified by scripts/audit/csp-harness.mjs).
# If the inline theme script in index.html changes, run `npm run csp:check` and update the hash in BOTH files.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Real files win; any other path (/work/payroll, /contact, ...) is served the app, which routes it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-xlb+6aoL0gif5jjNS8BGXIl/wpXiwv2mHThEQE021E8='; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

# Hashed build files and fonts never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pictures are replaced in place while the site is young: cache a day, not a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
